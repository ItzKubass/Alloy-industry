block.alloy-industry-alloy-conveyor.name = Slitinov\u00fd p\u00e1s
block.alloy-industry-alloy-conveyor.description = Rychl\u00fd st\u0159edn\u011b pokro\u010dil\u00fd p\u00e1s. Rychlej\u0161\u00ed ne\u017e titanov\u00fd, ale s men\u0161\u00ed kapacitou ne\u017e plastanov\u00fd.

block.alloy-industry-alloy-bridge.name = Slitinov\u00e9 p\u0159emost\u011bn\u00ed p\u0159epravn\u00edku
block.alloy-industry-alloy-bridge.description = P\u0159emost\u011bn\u00ed navr\u017een\u00e9 pro Slitinov\u00e9 p\u00e1sy. Dost rychl\u00e9 na to, aby je nezpomalovalo.

block.alloy-industry-large-kiln.name = Velk\u00e1 tav\u00edc\u00ed pec
block.alloy-industry-large-kiln.description = Roz\u0161\u00ed\u0159en\u00e1 verze vysok\u00e9 pece. Tav\u00ed p\u00edsek a olovo na metasklo rychleji a ve v\u011bt\u0161\u00edm mno\u017estv\u00ed.

block.alloy-industry-medium-solar-panel.name = St\u0159edn\u00ed sol\u00e1rn\u00ed panel
block.alloy-industry-medium-solar-panel.description = Poskytuje st\u0159edn\u00ed mno\u017estv\u00ed energie ze slunce. Efektivn\u011bj\u0161\u00ed ne\u017e mal\u00fd panel, ale m\u00e9n\u011b \u00fa\u010dinn\u00fd ne\u017e velk\u00fd.