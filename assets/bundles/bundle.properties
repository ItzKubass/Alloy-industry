block.alloy-industry-alloy-conveyor.name = Alloy Conveyor
block.alloy-industry-alloy-conveyor.description = A fast mid-tier conveyor. Faster than titanium, but with lower capacity than plastanium.

block.alloy-industry-alloy-bridge.name = Alloy Bridge
block.alloy-industry-alloy-bridge.description = A bridge designed for Alloy Conveyors. Fast enough to not slow them down.

block.alloy-industry-large-kiln.name = Large Kiln
block.alloy-industry-large-kiln.description = An enlarged version of the Kiln. Smelts sand and lead into metaglass faster and in larger quantities.

block.alloy-industry-medium-solar-panel.name = Medium Solar Panel
block.alloy-industry-medium-solar-panel.description = Provides a moderate amount of power from the sun. More efficient than the standard solar panel, but less than the large one.